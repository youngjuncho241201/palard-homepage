<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의 완료 - 팔라드 (PALARD)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/PALARD_mark_trim.png">

  <!-- Fonts -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <!-- CSS & JS (Vite) -->
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>

  <style>
    /* 땡큐 페이지 특화 스타일 — 다크 테마 */
    body {
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    #heroTriangles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: auto; /* 마우스 인터랙션 유지 */
    }

    .thank-you-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
      pointer-events: none;
      padding: 24px;
    }

    .thank-you-content {
      pointer-events: auto;
      background: rgba(14, 21, 36, 0.85);
      padding: 4rem 3.4rem;
      border-radius: 12px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 168, 200, 0.22);
      border-top: 2px solid var(--cyan);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
      animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-width: 560px;
    }

    .thank-you-eyebrow {
      font-family: var(--font-tech);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--cyan);
      margin-bottom: 14px;
    }

    .thank-you-title {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 1rem;
      color: var(--text-hi);
      word-break: keep-all;
    }

    .thank-you-text {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 2.4rem;
      line-height: 1.75;
      word-break: keep-all;
    }

    .thank-you-btn {
      display: inline-block;
      padding: 0.95rem 2.4rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 4px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(59, 130, 246, 0.3);
    }

    .thank-you-btn:hover {
      background-color: var(--primary-hover);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 0 34px rgba(96, 165, 250, 0.45);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 삼각형 인터랙션 배경 (main.js가 자동 감지 후 실행) -->
  <canvas id="heroTriangles" aria-hidden="true"></canvas>

  <div class="thank-you-container">
    <div class="thank-you-content">
      <div class="thank-you-eyebrow">MESSAGE RECEIVED</div>
      <h1 class="thank-you-title">문의가 접수되었습니다</h1>
      <p class="thank-you-text">
        소중한 비즈니스 의견을 남겨주셔서 감사합니다.<br>
        빠른 시일 내에 기재해주신 연락처로 답변드리겠습니다.
      </p>
      <a href="index.html" class="thank-you-btn">홈으로 돌아가기</a>
    </div>
  </div>

</body>
</html>
